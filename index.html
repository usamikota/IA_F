<script>
"use strict";

/* ================= 問診票 v1 ================= */
const BASE_Q = [
  { key:"label", type:"text", q:"診断したいものは、なんですか。",
    help:"世間がそれを呼んでいる名前で結構です。",
    ph:"例）真空管アニール炉をつくる会社／看護師／金型を手で磨く職人" },

  { key:"does", type:"area", q:"それは、いちばん何が得意ですか。",
    help:"「精度が高い」ではなく、できれば数字で。何度で、何分で、何個まで。",
    ph:"例）ガラスと金属を、割らずにぴったり接合できる。1000度まで上げて、真空を保ったまま" },

  { key:"fail", type:"area", q:"いちばん失敗しやすいのは、どんな条件のときですか。",
    help:"失敗する条件が分かると、その力の正体が分かります。",
    ph:"例）冷やす速度が速すぎると割れる。材料の組み合わせによっては歪みが残る" },

  { key:"refused", type:"choice", q:"他社に断られて、あなたのところに回ってきた仕事はありますか。",
    help:"「代わりがいるか」は、この出来事で測ります。自己申告では測りません。",
    opts:[
      { v:"よくある",  t:"よくある" },
      { v:"何度かある",t:"何度かある" },
      { v:"ない",      t:"ない" },
      { v:"わからない",t:"わからない・数えたことがない" }
    ]},

  { key:"novice", type:"area", optional:true, q:"新人が必ずつまずくのは、どこですか。",
    help:"つまずく場所に、言葉になっていない技術が埋まっています。飛ばせます。",
    ph:"例）温度計の数字ではなく、色を見て判断するところ" },

  { key:"cont", type:"choice", q:"それを続けられなくなる心配は、ありますか。",
    help:"人の場合は「その職場で誰が代われるか」として答えてください。",
    opts:[
      { v:"切迫",      t:"もう失われた／数年内にありうる" },
      { v:"未定",      t:"決まっていない" },
      { v:"見込みあり",t:"引き継ぐ相手がいる" },
      { v:"判定不能",  t:"わからない" }
    ]}
];

/* 断られた理由 → 次に追加される質問（外れが問診票を育てる） */
const REJECTIONS = [
  { why:"大きさ・規模が合わない",       add:"対応できる大きさの範囲は、どこからどこまでですか。" },
  { why:"費用が合わない",               add:"1件あたり、いくらから受けられますか。" },
  { why:"認証・規格が足りない",         add:"すでに取得している規格・認証はありますか。" },
  { why:"納期が合わない",               add:"1件あたり、どれくらいの期間がかかりますか。" },
  { why:"相手はすでに自社でやっていた", add:"その業界が自社でやっているかを、確認しましたか。" },
  { why:"連絡先にたどり着けなかった",   add:"その業界で、決める人はどの部署にいますか。" }
];

/* 他社に断られて回ってきたか → 代替の探索結果（機械的に導く） */

const DIFFS=["そのまま","設計変更","認証・規制"];
const DIFF_CLS={"そのまま":"a","設計変更":"b","認証・規制":"c"};
const SRC_CLS={"一次":"p","公開":"o","仮説":"h"};

const TYPE_RULES=[
  ["見つからなかった／限られる","そのまま",  "即当たり型","いま買い手候補に当てられる。まず言い回しの実在を確認する"],
  ["見つからなかった／限られる","設計変更",  "共同開発型","相手側の設計変更が要る。探す前に条件を詰める"],
  ["見つからなかった／限られる","認証・規制","認証投資型","時間と資金が要る。単独では届かない"],
  ["ある","候補3件以上",                     "翻訳不足型","希少性では差がつかない。相手の言葉に書き直せば値がつく余地がある"],
  ["ある","候補2件以下",                     "価格勝負型","この枠組みでは差がつきにくい。分解をやり直す"],
  ["判定不能","—",                           "判定不能",  "まず『断られて回ってきた仕事』を数える"]
];
function decideType(sub,funcs){
  const lv=sub&&sub.level;
  if(!lv||lv==="判定不能") return {name:"判定不能",next:"まず『他社に断られて回ってきた仕事』を数える"};
  if(lv==="ある") return funcs.length>=3
    ? {name:"翻訳不足型",next:"希少性では差がつかない。相手の言葉に書き直したうえで、その言い回しが実在するか確認する"}
    : {name:"価格勝負型",next:"この枠組みでは差がつきにくい。機能の分解をやり直す"};
  const d=funcs.map(f=>f.diff), s=DIFFS.find(x=>d.includes(x));
  if(s==="そのまま")   return {name:"即当たり型",next:"いま買い手候補に当てられる。まず言い回しの実在を確認する"};
  if(s==="設計変更")   return {name:"共同開発型",next:"相手側の設計変更が要る。探す前に条件を詰める"};
  if(s==="認証・規制") return {name:"認証投資型",next:"時間と資金が要る。単独では届かない"};
  return {name:"判定不能",next:"到達難易度が1件も判定できていない"};
}

/* ================= ウィザード ================= */
function drawStep(){
  const QS=currentQuestions();
  if(step>=QS.length) step=QS.length-1;
  const q=QS[step], val=answers[q.key]||"";
  const bars=QS.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("");
  let field="";
  if(q.type==="choice"){
    field=`<div class="opts">${q.opts.map(o=>
      `<button type="button" class="opt ${val===o.v?"sel":""}" data-v="${esc(o.v)}">
         <span class="mark"></span><span>${esc(o.t)}</span></button>`).join("")}</div>`;
  } else if(q.type==="area"){
    field=`<textarea id="f" placeholder="${esc(q.ph)}">${esc(val)}</textarea>`;
  } else {
    field=`<input class="line" id="f" placeholder="${esc(q.ph)}" value="${esc(val)}">`;
  }
  stage.innerHTML=`<div class="card">
    <div class="qbar">${bars}</div>
    <div class="qbody">
      <div class="verrow">
        <div class="qnum">質問 ${step+1} / ${QS.length}</div>
        <span class="verbadge">問診票 <b>v${version()}</b></span>
      </div>
      <h2 class="qtext">${esc(q.q)}</h2>
      <p class="qhelp">${esc(q.help)}</p>
      ${field}
      <div class="qnav">
        <button class="next" id="nx">${step===QS.length-1?"診断する":"次へ"}</button>
        ${q.optional?`<button class="skip" id="sk">飛ばす</button>`:""}
        ${step>0?`<button class="back" id="bk">戻る</button>`:""}
      </div>
    </div></div>`;

  const f=$("f"), nx=$("nx");
  const sync=()=>{ if(f) answers[q.key]=f.value.trim();
    nx.disabled = !q.optional && !(answers[q.key]||"").trim(); };
  if(f){ f.addEventListener("input",sync); sync(); f.focus();
    f.addEventListener("keydown",e=>{ if(e.key==="Enter"&&q.type!=="area"){e.preventDefault(); if(!nx.disabled) nx.click();} }); }
  if(q.type==="choice"){
    nx.disabled=!val;
    stage.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      answers[q.key]=b.dataset.v;
      stage.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); nx.disabled=false; }));
  }
  nx.addEventListener("click",()=>{ if(step<QS.length-1){ step++; drawStep(); } else go(null); });
  const sk=$("sk"); if(sk) sk.addEventListener("click",()=>{ answers[q.key]=""; step++; drawStep(); });
  const bk=$("bk"); if(bk) bk.addEventListener("click",()=>{ step--; drawStep(); });
}

/* ================= 実行 ================= */
const LSTEPS=["答えを読む","失敗する条件から、力の正体を割り出す",
  "その力を、業界ごとの言い方へ翻訳する","答えられた事実だけで判定する"];
function showLoad(){
  clearT();
  load.innerHTML=LSTEPS.map((s,i)=>`<div class="lstep"><span class="d"></span><span>${esc(s)}</span></div>`).join("");
  load.hidden=false; res.hidden=true; res.innerHTML=""; stage.innerHTML=""; quick.hidden=true;
  let i=0;
  const adv=()=>{ load.querySelectorAll(".lstep").forEach((el,n)=>{
      el.classList.toggle("on",n===i); el.classList.toggle("done",n<i); });
    if(i<LSTEPS.length-1){ i++; timers.push(setTimeout(adv,1300+i*450)); } };
  adv();
}
function hideLoad(){ clearT(); load.hidden=true; }

async function go(presetKey){
  const preset=(presetKey&&PRESETS[presetKey]&&PRESETS[presetKey].data)?presetKey:null;
  showLoad();
  const sub = SUB_FROM_REFUSED[answers.refused] || SUB_FROM_REFUSED["わからない"];
  const extras = addedQuestions().map((a,i)=>answers["ext"+i]?("追加質問「"+a+"」への回答: "+answers["ext"+i]):"").filter(Boolean).join("\n");

  if(!sampleFn){
    if(preset){ setTimeout(()=>{ hideLoad();
      render(PRESETS[preset].data, sub, {html:"この表示環境ではライブ診断が使えないため、<strong>収録済みの結果</strong>を表示しています。"});
    },2100); }
    else{ hideLoad(); showErr("この表示環境ではライブ診断が使えません。収録ケースからお試しください。",null,sub); }
    return;
  }
  try{
    const d=await sampleFn.json(buildPrompt(answers,sub,extras),{modelTier:"default"});
    hideLoad();
    if(!d||!Array.isArray(d.functions)||!d.functions.length) showErr("診断結果を読み取れませんでした。",preset,sub);
    else render(d,sub,null);
  }catch(e){ hideLoad(); showErr(ERR[e&&e.code]||"診断に失敗しました。時間をおいてお試しください。",preset,sub); }
}
const ERR={not_granted:"この機能の利用が許可されませんでした。",
  sampling_disabled:"この表示環境ではライブ診断が無効になっています。",
  not_declared:"この表示環境ではライブ診断が使えません。",
  rate_limited:"短時間に呼び出しすぎました。少し待ってからお試しください。",
  refused:"この入力では診断できませんでした。書き方を変えてお試しください。",
  prompt_too_large:"入力が長すぎます。短くしてお試しください。",
  invalid_json:"診断結果の形式が崩れました。もう一度お試しください。",
  empty_completion:"診断結果が返りませんでした。もう一度お試しください。",
  cancelled:"診断を中止しました。"};

function showErr(msg,preset,sub){
  res.innerHTML=`<div class="err"><div>${esc(msg)}</div><div class="again">
    ${preset?`<button class="skip" id="fb">収録済みの結果を表示する</button>`:""}
    <button class="skip" id="rs">はじめから</button></div></div>`;
  res.hidden=false;
  const fb=$("fb"); if(fb) fb.addEventListener("click",()=>render(PRESETS[preset].data,sub,
    {warn:true,html:"ライブ診断が使えなかったため、<strong>収録済みの結果</strong>を表示しています。"}));
  $("rs").addEventListener("click",restart);
}
function restart(){ step=0; answers={}; res.hidden=true; res.innerHTML="";
  load.hidden=true; quick.hidden=false; drawStep(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ================= 結果 ================= */
function render(d,sub,note){
  lastData=d;
  const funcs=(d.functions||[]).slice(0,5);
  const cont=d.continuity||{level:"判定不能",subject:"事業",note:"",src:"仮説"};
  const vd=Number.isFinite(d.verifiedDemand)?d.verifiedDemand:0;
  const t=decideType(sub,funcs);
  const unk=[]; if(sub.level==="判定不能")unk.push("代替の探索");
  if(cont.level==="判定不能")unk.push(cont.subject==="組織"?"引き継ぎ困難度":"切迫度");
  if(vd===0)unk.push("言い回しが実在するかの確認");
  const contName=cont.subject==="組織"?"引き継ぎ困難度":"失われる切迫度";

  res.innerHTML=`
  ${note?`<div class="banner ${note.warn?"warn":""}">${note.html}</div>`:""}

  <div class="hero">
    <div class="verrow"><span class="verbadge">問診票 <b>v${version()}</b> で診断</span>
      <span class="verbadge" style="color:var(--ink-3);border-color:var(--rule-strong);background:var(--surface-3)">外れの記録 <b>${ledger.length}</b>件</span></div>
    <div class="was"><div class="cap">世間が付けている名前</div><div class="txt">${esc(d.label)}</div></div>
    <div class="heroline">この力を必要としているのは、<br><em>${funcs.length}つの、別の業界でした。</em></div>
  </div>

  <div class="sec">
    <div class="secttl"><span class="n">01</span><h2>必要としている業界</h2></div>
    <div class="matches">
      ${funcs.map((f,i)=>`
        <div class="match" style="animation-delay:${i*0.14}s" data-i="${i}">
          <div class="mtop">
            <div class="mname">${esc(f.target)}</div>
            <div class="badges">
              <span class="bdg ${DIFF_CLS[f.diff]||"b"}">${esc(f.diff)}</span>
              <span class="bdg ${SRC_CLS[f.src]||"h"}">${esc(f.src||"仮説")}</span>
            </div>
          </div>
          <div class="saying">${esc(f.demand)}</div>
          <div class="from"><b>この力から：</b>${esc(f.fn)}<br><b>難しさ：</b>${esc(f.cond)}</div>
          <button class="rejbtn" data-rej="${i}">ここに当てて、断られた</button>
          <div class="rejpanel" data-panel="${i}" hidden></div>
        </div>`).join("")}
    </div>
    <div class="legend">
      <span><span class="bdg a">そのまま</span> 手を加えず届く</span>
      <span><span class="bdg b">設計変更</span> 相手側の変更が要る</span>
      <span><span class="bdg c">認証・規制</span> 時間と資金が要る</span>
      <span><span class="bdg p">一次</span> 本人から得た事実</span>
      <span><span class="bdg h">仮説</span> 未検証</span>
    </div>
  </div>

  <div class="sec">
    <div class="secttl"><span class="n">02</span><h2>同じ力が、業界ごとに別の名前で呼ばれている</h2></div>
    <div class="dict">
      ${funcs.filter(f=>Array.isArray(f.aliases)&&f.aliases.length).map(f=>`
        <div class="dentry">
          <div class="dhead">${esc(f.fn)}</div>
          <div class="dlist">${f.aliases.slice(0,4).map(al=>
            `<div class="drow"><div class="dind">${esc(al.ind)}</div><div class="dsay">${esc(al.say)}</div></div>`).join("")}</div>
        </div>`).join("")}
    </div>
    <p class="summary">呼び方が違うから、探しても見つかりません。<strong>この対応表を持っている者だけが、橋を架けられます。</strong></p>
  </div>

  ${d.tacit?`<div class="sec">
    <div class="secttl"><span class="n">03</span><h2>言葉になっていない技術</h2></div>
    <p class="summary">${esc(d.tacit)}</p>
    <p class="pnote">「新人がつまずくところ」から取り出しました。<strong>本人に聞かないと出てこない情報です。</strong>公開情報からは取れません。</p>
  </div>`:""}

  <div class="sec">
    <div class="secttl"><span class="n">04</span><h2>判定</h2></div>
    ${unk.length?`<div class="unkbar"><strong>判定不能 ${unk.length}項目</strong> ─ ${esc(unk.join(" ／ "))}。埋めずに空けています。</div>`:""}
    <div class="jgrid">
      <div class="jc"><div class="k">型</div><div class="v" style="color:var(--accent)">${esc(t.name)}</div><div class="w">${esc(t.next)}</div></div>
      <div class="jc ${sub.level==="判定不能"?"unk":""}"><div class="k">代替の探索結果</div><div class="v">${esc(sub.level)}</div><div class="w">${esc(sub.scope)}</div></div>
      <div class="jc"><div class="k">届いた業界／確認済</div><div class="v">${funcs.length}件 ／ ${vd}件</div><div class="w">${vd===0?"言い回しの実在は未確認です。残りは仮説。":"確認済みの件数です。"}</div></div>
      <div class="jc ${cont.level==="判定不能"?"unk":""}"><div class="k">${esc(contName)}</div><div class="v">${esc(cont.level)}</div><div class="w">${esc(cont.note)}</div></div>
    </div>
    <details class="rb"><summary>型はこの表で機械的に決まります</summary>
      <div class="in"><table>
        <thead><tr><th>代替の探索結果</th><th>条件</th><th>型</th><th>次の一手</th></tr></thead>
        <tbody>${TYPE_RULES.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td><strong>${esc(r[2])}</strong></td><td>${esc(r[3])}</td></tr>`).join("")}</tbody>
      </table></div></details>
    <p class="summary">${esc(d.note)}</p>
  </div>

  <div class="sec">
    <div class="secttl"><span class="n">05</span><h2>外れの台帳</h2></div>
    <div class="moat">
      <div class="h">断られるたびに、問診票が1つ賢くなります。</div>
      <p>上の業界カードで<strong>「ここに当てて、断られた」</strong>を押してみてください。断られた理由から、<strong>次に聞くべき質問</strong>が問診票に追加されます。</p>
      <p>候補を出すことは誰にでもできます。<strong>外し方を知っていることは、外した回数でしか手に入りません。</strong>ここが真似できない部分です。</p>
    </div>
    <div id="ledgerbox"></div>
  </div>

  <div class="sec">
    <div class="secttl"><span class="n">06</span><h2>値づけ</h2></div>
    <div class="price">
      ${(d.costs||[]).map(c=>`<div class="pitem"><span>${esc(typeof c==="string"?c:(c&&c.item))}</span><span>買い手への照会で確定</span></div>`).join("")}
      <div class="pnote"><strong>金額はこの診断では出しません。</strong>根拠のない数字で値をつけたら、私たちの主張そのものが崩れるからです。値は買い手が決めます。この診断が出すのは、<strong>誰に見積を頼めばよいか</strong>と、<strong>その見積書の項目</strong>です。（成約実績 0件）</div>
    </div>
  </div>

  <div class="again"><button class="next" id="rs2">もう一度診断する</button>
    <button class="tiny" id="clr">台帳をリセット（デモ用）</button></div>

  <div class="foot">
    <div>・<strong>仮説</strong>と付いた項目は未検証です。出所の付かない主張は表示していません。</div>
    <div>・金額・市場規模・年数は、出典が確定するまで記載しません。</div>
    <div>・外れの台帳は、この端末のブラウザにのみ保存されます。</div>
    <div>・本ページはプロトタイプです。実サービスの評価結果ではありません。</div>
  </div>`;

  res.hidden=false; quick.hidden=true;
  drawLedger();
  res.querySelectorAll("[data-rej]").forEach(b=>b.addEventListener("click",()=>openRej(+b.dataset.rej,funcs)));
  $("rs2").addEventListener("click",restart);
  $("clr").addEventListener("click",()=>{ ledger=[]; saveLedger(ledger); render(d,sub,null); });
  window.scrollTo({top:0,behavior:"smooth"});
}

function openRej(i,funcs){
  const p=res.querySelector(`[data-panel="${i}"]`);
  if(!p) return;
  if(!p.hidden){ p.hidden=true; return; }
  p.hidden=false;
  p.innerHTML=`<div class="t">断られた理由は、どれに近いですか。</div>
    <div class="rejopts">${REJECTIONS.map((r,n)=>
      `<button class="rejopt" data-r="${n}">${esc(r.why)}</button>`).join("")}</div>`;
  p.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{
    const r=REJECTIONS[+b.dataset.r];
    const before=version();
    ledger.push({target:funcs[i].target, why:r.why, add:r.add});
    saveLedger(ledger);
    const after=version();
    p.innerHTML=`<div class="evolve">
      <div class="up">問診票 v${before} → v${after}</div>
      <div class="add">${esc(r.add)}</div>
    </div>`;
    res.querySelectorAll(".verbadge b").forEach((el,n)=>{ el.textContent = n===0?("v"+after):String(ledger.length); });
    drawLedger();
  }));
}

function drawLedger(){
  const box=$("ledgerbox"); if(!box) return;
  if(!ledger.length){
    box.innerHTML=`<div class="lempty">まだ1件も記録がありません。<strong>ここが0件のうちは、優位性はありません。</strong>正直にそう表示します。</div>`;
    return;
  }
  box.innerHTML=`<div class="ledger">${ledger.map(e=>
    `<div class="lrow"><span><strong>${esc(e.target)}</strong><br><span style="color:var(--ink-3);font-size:14px">＋ ${esc(e.add)}</span></span>
     <span class="why">${esc(e.why)}</span></div>`).join("")}</div>`;
}

drawStep();
</script>

</div>
