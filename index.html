<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>見えない付加価値診断（AIなし・オフライン版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
:root{
  color-scheme:light dark;
  --bg:#F2F5F3;--surface:#FFFFFF;--surface-2:#E5EAE7;--surface-3:#F8FAF9;
  --ink:#0E1614;--ink-2:#3F4C48;--ink-3:#6E7A76;
  --rule:#CFD8D4;--rule-strong:#A9B5B0;
  --accent:#0F5B56;--accent-2:#17827A;--accent-wash:#DFEEEB;
  --signal:#9C3823;--signal-wash:#F7E6E1;
  --shadow:0 1px 2px rgba(14,22,20,.05),0 12px 32px -22px rgba(14,22,20,.35);
  --shadow-lg:0 2px 6px rgba(14,22,20,.07),0 30px 60px -34px rgba(14,22,20,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1211;--surface:#161D1B;--surface-2:#222A28;--surface-3:#121917;
    --ink:#EEF3F1;--ink-2:#AAB5B1;--ink-3:#7D8884;
    --rule:#2A3330;--rule-strong:#3D4844;
    --accent:#6BC9BF;--accent-2:#8FDCD3;--accent-wash:#122622;
    --signal:#E89078;--signal-wash:#2C1D18;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -22px rgba(0,0,0,.85);
    --shadow-lg:0 2px 6px rgba(0,0,0,.55),0 30px 60px -34px rgba(0,0,0,.95);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1211;--surface:#161D1B;--surface-2:#222A28;--surface-3:#121917;
  --ink:#EEF3F1;--ink-2:#AAB5B1;--ink-3:#7D8884;
  --rule:#2A3330;--rule-strong:#3D4844;
  --accent:#6BC9BF;--accent-2:#8FDCD3;--accent-wash:#122622;
  --signal:#E89078;--signal-wash:#2C1D18;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -22px rgba(0,0,0,.85);
  --shadow-lg:0 2px 6px rgba(0,0,0,.55),0 30px 60px -34px rgba(0,0,0,.95);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  font-size:17px;line-height:1.8;margin:0;padding:0 22px 90px;-webkit-font-smoothing:antialiased}
img{max-width:100%}
.wrap{max-width:840px;margin:0 auto}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- header ---------- */
header.top{padding:40px 0 26px;display:flex;flex-direction:column;gap:12px}
.kicker{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent);font-weight:600}
h1.title{font-family:"Zen Old Mincho","Hiragino Mincho ProN",serif;font-weight:700;
  font-size:clamp(28px,5.4vw,42px);margin:0;line-height:1.28;letter-spacing:.01em}
.tagline{color:var(--ink-2);font-size:17px;line-height:1.75;max-width:34ch}
.modebar{border:1px solid var(--rule-strong);background:var(--surface-2);border-radius:4px;
  padding:13px 17px;font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.modebar strong{color:var(--ink)}

/* ---------- wizard ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;
  box-shadow:var(--shadow-lg);overflow:hidden}
.qbar{display:flex;gap:6px;padding:16px 26px 0}
.qbar i{flex:1;height:4px;border-radius:2px;background:var(--surface-2);transition:background .3s}
.qbar i.on{background:var(--accent)}
.qbody{padding:26px 26px 30px;display:flex;flex-direction:column;gap:22px}
.qnum{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.16em;
  color:var(--ink-3);font-weight:600}
.qtext{font-family:"Zen Old Mincho",serif;font-size:clamp(21px,3.6vw,28px);font-weight:600;
  line-height:1.5;margin:0}
.qhelp{font-size:15px;color:var(--ink-3);line-height:1.75;margin-top:-10px}
textarea,input.line{width:100%;background:var(--surface-3);border:2px solid var(--rule-strong);
  border-radius:4px;padding:16px 18px;font-family:inherit;font-size:19px;line-height:1.7;color:var(--ink)}
textarea{min-height:104px;resize:vertical}
textarea::placeholder,input.line::placeholder{color:var(--ink-3);font-size:16px}
textarea:focus,input.line:focus{border-color:var(--accent);outline:none}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:center;gap:15px;background:var(--surface-3);
  border:2px solid var(--rule);border-radius:4px;padding:17px 20px;cursor:pointer;
  font-family:inherit;font-size:18px;font-weight:500;color:var(--ink);text-align:left;width:100%;
  transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-wash)}
.opt .mark{width:20px;height:20px;border-radius:50%;border:2px solid var(--rule-strong);
  flex:0 0 auto;position:relative}
.opt.sel .mark{border-color:var(--accent)}
.opt.sel .mark::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.qnav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:4px}
button.next{background:var(--accent);color:var(--surface);border:none;border-radius:4px;
  padding:16px 38px;font-family:inherit;font-size:18px;font-weight:700;cursor:pointer;letter-spacing:.05em}
button.next:hover{background:var(--accent-2)}
button.next:disabled{opacity:.35;cursor:not-allowed}
button.back{background:none;border:none;color:var(--ink-3);font-family:inherit;font-size:16px;
  cursor:pointer;padding:16px 8px;text-decoration:underline;text-underline-offset:4px}
button.skip{background:none;border:1px solid var(--rule-strong);border-radius:4px;color:var(--ink-2);
  font-family:inherit;font-size:15px;cursor:pointer;padding:14px 20px}

/* presets */
.quick{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.quick .cap{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600}
.qchips{display:flex;gap:10px;flex-wrap:wrap}
.qchip{background:var(--surface);border:1px solid var(--rule-strong);border-radius:100px;
  padding:11px 22px;font-size:15.5px;font-family:inherit;color:var(--ink-2);cursor:pointer}
.qchip:hover{border-color:var(--accent);color:var(--accent)}
.hint{margin-top:16px;font-size:14px;color:var(--ink-3);line-height:1.8}

/* ---------- loading ---------- */
.load{margin-top:30px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;
  padding:30px 26px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.lstep{display:flex;align-items:center;gap:16px;font-size:17px;color:var(--ink-3);transition:color .3s}
.lstep .d{width:10px;height:10px;border-radius:50%;background:var(--rule-strong);flex:0 0 auto;transition:.3s}
.lstep.on{color:var(--ink);font-weight:700}
.lstep.on .d{background:var(--accent);transform:scale(1.5)}
.lstep.done .d{background:var(--accent)}

/* ---------- result ---------- */
.result{margin-top:30px;display:flex;flex-direction:column;gap:40px}
.banner{border:1px solid var(--rule-strong);background:var(--surface-2);border-radius:4px;
  padding:14px 18px;font-size:15px;line-height:1.75;color:var(--ink-2)}
.banner.warn{border-color:var(--signal);background:var(--signal-wash);color:var(--ink)}

.hero{display:flex;flex-direction:column;gap:14px}
.was{display:flex;flex-direction:column;gap:4px}
.was .cap{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600}
.was .txt{font-size:21px;font-weight:700;color:var(--ink-3);
  text-decoration:line-through;text-decoration-thickness:2px;line-height:1.45}
.heroline{font-family:"Zen Old Mincho",serif;font-size:clamp(24px,4.6vw,36px);font-weight:700;
  line-height:1.4}
.heroline em{font-style:normal;color:var(--accent)}

.secttl{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.secttl h2{font-family:"Zen Old Mincho",serif;font-size:23px;font-weight:600;margin:0;line-height:1.4}
.secttl .n{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--accent);font-weight:600}
.sec{display:flex;flex-direction:column;gap:18px}

.matches{display:flex;flex-direction:column;gap:16px}
.match{background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--accent);
  border-radius:5px;padding:24px 26px;display:flex;flex-direction:column;gap:14px;
  box-shadow:var(--shadow);opacity:0;transform:translateY(8px);animation:rise .5s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.match{opacity:1;transform:none;animation:none}}
.mtop{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.mname{font-size:clamp(20px,3.4vw,25px);font-weight:900;line-height:1.35;letter-spacing:.01em}
.badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.bdg{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;font-weight:600;
  padding:4px 11px;border-radius:3px;white-space:nowrap;letter-spacing:.04em;border:1px solid transparent}
.bdg.a{color:var(--accent);background:var(--accent-wash);border-color:var(--accent)}
.bdg.b{color:var(--ink-2);background:var(--surface-2);border-color:var(--rule-strong)}
.bdg.c{color:var(--signal);background:var(--signal-wash);border-color:var(--signal)}
.bdg.h{color:var(--signal);background:transparent;border-color:var(--signal)}
.bdg.o{color:var(--ink-2);background:transparent;border-color:var(--rule-strong)}
.bdg.p{color:var(--accent);background:transparent;border-color:var(--accent)}
.saying{font-size:18px;line-height:1.75;color:var(--ink);padding:14px 18px;
  background:var(--surface-3);border-radius:4px;border-left:3px solid var(--rule-strong)}
.saying::before{content:"「"}.saying::after{content:"」"}
.from{font-size:14.5px;color:var(--ink-3);line-height:1.7}
.from b{color:var(--ink-2);font-weight:700}

.jgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.jc{background:var(--surface);padding:18px 20px;display:flex;flex-direction:column;gap:7px}
.jc.unk{background:var(--surface-3)}
.jc .k{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600}
.jc .v{font-size:20px;font-weight:900;line-height:1.35}
.jc.unk .v{color:var(--ink-3);font-weight:500}
.jc .w{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.unkbar{background:var(--signal-wash);border:1px solid var(--signal);border-radius:4px;
  padding:14px 18px;font-size:15.5px;line-height:1.7}
details.rb{border:1px solid var(--rule);border-radius:4px;background:var(--surface-3)}
details.rb summary{padding:15px 20px;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink-2);
  list-style:none;display:flex;align-items:center;gap:9px}
details.rb summary::-webkit-details-marker{display:none}
details.rb summary::before{content:"▸";color:var(--accent);font-size:12px}
details.rb[open] summary::before{content:"▾"}
details.rb .in{padding:0 20px 20px;overflow-x:auto}
details.rb table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
details.rb th,details.rb td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);line-height:1.6}
details.rb th{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);font-weight:600}
.summary{font-size:17px;line-height:1.85;background:var(--accent-wash);border-radius:4px;padding:20px 22px}

.price{display:flex;flex-direction:column;gap:14px}
.pitem{display:flex;justify-content:space-between;gap:16px;align-items:baseline;
  padding:14px 18px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;font-size:16px}
.pitem span:last-child{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;
  color:var(--ink-3);white-space:nowrap}
.pnote{font-size:15.5px;line-height:1.8;color:var(--ink-2);border:1px dashed var(--rule-strong);
  border-radius:4px;padding:18px 20px;background:var(--surface-3)}
.pnote strong{color:var(--ink)}

.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--ink-3);line-height:2}
.legend span{display:inline-flex;align-items:center;gap:7px}
.foot{border-top:1px solid var(--rule);padding-top:20px;color:var(--ink-3);font-size:14px;
  line-height:1.85;display:flex;flex-direction:column;gap:5px}
.err{border:1px solid var(--signal);background:var(--signal-wash);border-radius:4px;
  padding:20px;font-size:16px;line-height:1.8;display:flex;flex-direction:column;gap:14px}
.again{display:flex;gap:12px;flex-wrap:wrap}

.verbadge{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--accent);
  border-radius:100px;padding:6px 16px;font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-wash);white-space:nowrap}
.verbadge b{font-size:15px}
.verrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.dict{display:flex;flex-direction:column;gap:14px}
.dentry{background:var(--surface);border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.dhead{padding:15px 20px;background:var(--surface-3);border-bottom:1px solid var(--rule);
  font-size:17px;font-weight:700;line-height:1.55}
.dlist{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:13px 20px;
  border-bottom:1px solid var(--rule);align-items:baseline}
.drow:last-child{border-bottom:none}
.dind{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.06em;
  color:var(--ink-3);font-weight:600;line-height:1.7}
.dsay{font-size:16.5px;line-height:1.7;font-weight:500}

.rejbtn{background:none;border:1px solid var(--rule-strong);border-radius:4px;color:var(--ink-3);
  font-family:inherit;font-size:14px;cursor:pointer;padding:9px 16px;align-self:flex-start}
.rejbtn:hover{border-color:var(--signal);color:var(--signal)}
.rejpanel{border-top:1px dashed var(--rule-strong);padding-top:14px;display:flex;flex-direction:column;gap:11px}
.rejpanel .t{font-size:15px;font-weight:700;line-height:1.6}
.rejopts{display:flex;flex-direction:column;gap:8px}
.rejopt{background:var(--surface-3);border:1px solid var(--rule);border-radius:4px;padding:12px 16px;
  font-family:inherit;font-size:15.5px;color:var(--ink);cursor:pointer;text-align:left;line-height:1.6}
.rejopt:hover{border-color:var(--signal);background:var(--signal-wash)}
.evolve{background:var(--accent-wash);border:1px solid var(--accent);border-radius:4px;
  padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.evolve .up{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14px;font-weight:600;color:var(--accent)}
.evolve .add{font-size:17px;font-weight:700;line-height:1.6}
.evolve .add::before{content:"＋ 次から聞きます：";}
.ledger{display:flex;flex-direction:column;gap:10px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px 18px;background:var(--surface);
  border:1px solid var(--rule);border-radius:4px;font-size:15.5px;line-height:1.7;align-items:baseline}
.lrow .why{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12.5px;color:var(--signal);white-space:nowrap}
.lempty{border:1px dashed var(--rule-strong);border-radius:4px;padding:18px 20px;background:var(--surface-3);
  font-size:15.5px;color:var(--ink-2);line-height:1.8}
.moat{background:var(--surface);border:2px solid var(--accent);border-radius:5px;padding:22px 24px;
  display:flex;flex-direction:column;gap:10px}
.moat .h{font-family:"Zen Old Mincho",serif;font-size:20px;font-weight:700;line-height:1.5}
.moat p{font-size:16px;line-height:1.8;color:var(--ink-2)}
.moat strong{color:var(--ink)}
button.tiny{background:none;border:1px solid var(--rule-strong);border-radius:4px;color:var(--ink-3);
  font-family:inherit;font-size:13.5px;cursor:pointer;padding:8px 14px}
button.tiny:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:600px){
  body{padding:0 16px 70px;font-size:16px}
  .qbody{padding:22px 20px 26px}
  .match{padding:20px}
  .drow{grid-template-columns:1fr;gap:2px}
}
</style>
</head>
<body>

<div class="wrap">

<header class="top">
  <div class="kicker">Prototype / Offline</div>
  <h1 class="title">見えない付加価値診断</h1>
  <p class="tagline">6つの質問に答えるだけ。その技術・その人を<strong>必要としている業界</strong>を探します。</p>
  <div class="modebar">この画面は<strong>AIを使いません</strong>。あらかじめ収録した「力 → 業界」の対応表から、機械的に候補を選びます。対応表に当てはまるものが無ければ、埋めずに<strong>判定不能</strong>と表示します。</div>
</header>

<div id="stage"></div>

<div class="quick" id="quick">
  <div class="cap">収録ケースで試す</div>
  <div class="qchips" id="chips"></div>
  <p class="hint">自由入力も、この場で判定します（通信も外部サービスも使いません）。</p>
</div>

<div class="load" id="load" hidden></div>
<div class="result" id="res" hidden></div>

</div>

<script>
"use strict";

/* ================= 問診票 v1 ================= */
var BASE_Q = [
  { key:"label", type:"text", q:"診断したいものは、なんですか。",
    help:"世間がそれを呼んでいる名前で結構です。",
    ph:"例）真空管アニール炉をつくる会社／看護師／金型を手で磨く職人" },

  { key:"does", type:"area", q:"それは、いちばん何が得意ですか。",
    help:"「精度が高い」ではなく、できれば数字で。何度で、何分で、何個まで。",
    ph:"例）ガラスと金属を、割らずにぴったり接合できる。1000度まで上げて、真空を保ったまま" },

  { key:"fail", type:"area", q:"いちばん失敗しやすいのは、どんな条件のときですか。",
    help:"失敗する条件が分かると、その力の正体が分かります。",
    ph:"例）冷やす速度が速すぎると割れる。材料の組み合わせによっては歪みが残る" },

  { key:"refused", type:"choice", q:"他社に断られて、あなたのところに回ってきた仕事はありますか。",
    help:"「代わりがいるか」は、この出来事で測ります。自己申告では測りません。",
    opts:[
      { v:"よくある",  t:"よくある" },
      { v:"何度かある",t:"何度かある" },
      { v:"ない",      t:"ない" },
      { v:"わからない",t:"わからない・数えたことがない" }
    ]},

  { key:"novice", type:"area", optional:true, q:"新人が必ずつまずくのは、どこですか。",
    help:"つまずく場所に、言葉になっていない技術が埋まっています。飛ばせます。",
    ph:"例）温度計の数字ではなく、色を見て判断するところ" },

  { key:"cont", type:"choice", q:"それを続けられなくなる心配は、ありますか。",
    help:"人の場合は「その職場で誰が代われるか」として答えてください。",
    opts:[
      { v:"切迫",      t:"もう失われた／数年内にありうる" },
      { v:"未定",      t:"決まっていない" },
      { v:"見込みあり",t:"引き継ぐ相手がいる" },
      { v:"判定不能",  t:"わからない" }
    ]}
];

var REJECTIONS = [
  { why:"大きさ・規模が合わない",       add:"対応できる大きさの範囲は、どこからどこまでですか。" },
  { why:"費用が合わない",               add:"1件あたり、いくらから受けられますか。" },

function decideType(sub,funcs){
  var lv=sub&&sub.level;
  if(!lv||lv==="判定不能") return {name:"判定不能",next:"まず『他社に断られて回ってきた仕事』を数える"};
  if(lv==="ある") return funcs.length>=3
    ? {name:"翻訳不足型",next:"希少性では差がつかない。相手の言葉に書き直したうえで、その言い回しが実在するか確認する"}
    : {name:"価格勝負型",next:"この枠組みでは差がつきにくい。機能の分解をやり直す"};
  var d=funcs.map(function(f){return f.diff;});
  var s=null;
  for(var i=0;i<DIFFS.length;i++){ if(d.indexOf(DIFFS[i])>=0){ s=DIFFS[i]; break; } }
  if(s==="そのまま")   return {name:"即当たり型",next:"いま買い手候補に当てられる。まず言い回しの実在を確認する"};
  if(s==="設計変更")   return {name:"共同開発型",next:"相手側の設計変更が要る。探す前に条件を詰める"};
  if(s==="認証・規制") return {name:"認証投資型",next:"時間と資金が要る。単独では届かない"};
  return {name:"判定不能",next:"到達難易度が1件も判定できていない"};
}

/* 収録辞書からの機械的マッチング（AIなし） */
function matchKB(a){
  var text=[a.label,a.does,a.fail,a.novice].concat(
    addedQuestions().map(function(_,i){return a["ext"+i]||"";})).join(" ");
  var scored=[];
  KB.forEach(function(e){
    var hit=[],s=0;
    e.kw.forEach(function(k){ if(k && text.indexOf(k)>=0){ hit.push(k); s++; } });
    if(s>0) scored.push({e:e,score:s,hit:hit});
  });
  scored.sort(function(x,y){
    if(y.score!==x.score) return y.score-x.score;
    return DIFF_ORDER[x.e.diff]-DIFF_ORDER[y.e.diff];
  });
  var top = scored.length ? scored[0].score : 0;
  var minScore = (top>=2) ? 2 : 1;   /* 1語しか当たらない弱い候補は、強い候補がある時は出さない */
  var out=[],seen={};
  for(var i=0;i<scored.length && out.length<4;i++){
    if(scored[i].score < minScore) break;
    var t=scored[i].e.target;
    if(seen[t]) continue;
    seen[t]=1;
    var f=JSON.parse(JSON.stringify(scored[i].e));
    f.src="仮説"; f.hit=scored[i].hit;
    out.push(f);
  }
  out.sort(function(x,y){ return DIFF_ORDER[x.diff]-DIFF_ORDER[y.diff]; });
  return out;
}

function buildResult(a){
  var funcs=matchKB(a);
  if(!funcs.length) return null;
  var kind=guessKind(a.label);
  var costs = kind==="人材"
    ? ["同じ機能を持つ人を外から採用し、立ち上げるまでの期間","その間、現場が回らないことの影響"]
    : ["同じ設備を再設計・再製作する場合の費用","代わりを探している間、工程が止まる期間","規制のある用途に届かせる場合の認証取得の期間"];
  var seen={}, hitWords=[];
  funcs.forEach(function(f){ (f.hit||[]).forEach(function(w){ if(!seen[w]){seen[w]=1;hitWords.push(w);} }); });
  return {
    label:a.label, kind:kind, functions:funcs,
    tacit:(a.novice||"").trim(),
    continuity:{level:a.cont||"判定不能",subject:kind==="人材"?"組織":"事業",
      note:kind==="人材"?"個人は採点しません。測るのは組織側の依存度です。":"回答をそのまま使っています。",
      src:"一次"},
    verifiedDemand:0, costs:costs,
    matchedWords:hitWords,
    note:"既存の評価軸（"+(kind==="人材"?"履歴書":"決算書")+"）では、「"+a.label+"」の一行にしか見えません。機能まで割ると、上の"+funcs.length+"件に繋がります。ただしこれは、収録済みの対応表から言葉の一致で機械的に選んだ候補です。その業界が本当にこの言い回しで探しているかは、まだ確認していません。"
  };
}

/* ================= 収録ケース ================= */

/* ================= 状態 ================= */
function $(id){ return document.getElementById(id); }
var stage=$("stage"), load=$("load"), res=$("res"), chips=$("chips"), quick=$("quick");
var step=0, answers={}, timers=[], lastSub=null;
function esc(s){ var d=document.createElement("div"); d.textContent=(s==null?"":String(s)); return d.innerHTML; }
function clearT(){ timers.forEach(clearTimeout); timers=[]; }

Object.keys(PRESETS).forEach(function(k){
  var b=document.createElement("button");
  b.type="button"; b.className="qchip"; b.textContent=PRESETS[k].chip;
  b.addEventListener("click",function(){
    answers={};
    var src=PRESETS[k].answers;
    Object.keys(src).forEach(function(kk){ answers[kk]=src[kk]; });
    go();
  });
  chips.appendChild(b);
});

/* ================= ウィザード ================= */
function drawStep(){
  var QS=currentQuestions();
  if(step>=QS.length) step=QS.length-1;
  var q=QS[step], val=answers[q.key]||"";
  var bars=QS.map(function(_,i){ return '<i class="'+(i<=step?"on":"")+'"></i>'; }).join("");
  var field="";
  if(q.type==="choice"){
    field='<div class="opts">'+q.opts.map(function(o){
      return '<button type="button" class="opt '+(val===o.v?"sel":"")+'" data-v="'+esc(o.v)+'">'
        +'<span class="mark"></span><span>'+esc(o.t)+'</span></button>'; }).join("")+'</div>';
  } else if(q.type==="area"){
    field='<textarea id="f" placeholder="'+esc(q.ph)+'">'+esc(val)+'</textarea>';
  } else {
    field='<input class="line" id="f" placeholder="'+esc(q.ph)+'" value="'+esc(val)+'">';
  }
  stage.innerHTML='<div class="card">'
    +'<div class="qbar">'+bars+'</div>'
    +'<div class="qbody">'
    +'<div class="verrow"><div class="qnum">質問 '+(step+1)+' / '+QS.length+'</div>'
    +'<span class="verbadge">問診票 <b>v'+version()+'</b></span></div>'
    +'<h2 class="qtext">'+esc(q.q)+'</h2>'
    +'<p class="qhelp">'+esc(q.help)+'</p>'
    +field
    +'<div class="qnav">'
    +'<button class="next" id="nx">'+(step===QS.length-1?"診断する":"次へ")+'</button>'
    +(q.optional?'<button class="skip" id="sk">飛ばす</button>':"")
    +(step>0?'<button class="back" id="bk">戻る</button>':"")
    +'</div></div></div>';

  var f=$("f"), nx=$("nx");
  function sync(){ if(f) answers[q.key]=f.value.trim();
    nx.disabled = !q.optional && !(answers[q.key]||"").trim(); }
  if(f){ f.addEventListener("input",sync); sync(); f.focus();
    f.addEventListener("keydown",function(e){
      if(e.key==="Enter"&&q.type!=="area"){ e.preventDefault(); if(!nx.disabled) nx.click(); } }); }
  if(q.type==="choice"){
    nx.disabled=!val;
    Array.prototype.forEach.call(stage.querySelectorAll(".opt"),function(b){
      b.addEventListener("click",function(){
        answers[q.key]=b.dataset.v;
        Array.prototype.forEach.call(stage.querySelectorAll(".opt"),function(x){x.classList.remove("sel");});
        b.classList.add("sel"); nx.disabled=false; }); });
  }
  nx.addEventListener("click",function(){ if(step<QS.length-1){ step++; drawStep(); } else go(); });
  var sk=$("sk"); if(sk) sk.addEventListener("click",function(){ answers[q.key]=""; step++; drawStep(); });
  var bk=$("bk"); if(bk) bk.addEventListener("click",function(){ step--; drawStep(); });
}

/* ================= 実行 ================= */
var LSTEPS=["答えを読む","失敗する条件から、力の正体を割り出す",
  "収録済みの対応表と照らし合わせる","答えられた事実だけで判定する"];
function showLoad(){
  clearT();
  load.innerHTML=LSTEPS.map(function(s){
    return '<div class="lstep"><span class="d"></span><span>'+esc(s)+'</span></div>'; }).join("");
  load.hidden=false; res.hidden=true; res.innerHTML=""; stage.innerHTML=""; quick.hidden=true;
  var i=0;
  function adv(){
    Array.prototype.forEach.call(load.querySelectorAll(".lstep"),function(el,n){
      el.classList.toggle("on",n===i); el.classList.toggle("done",n<i); });
    if(i<LSTEPS.length-1){ i++; timers.push(setTimeout(adv,700+i*260)); }
  }
  adv();
}
function hideLoad(){ clearT(); load.hidden=true; }

function go(){
  showLoad();
  var sub = SUB_FROM_REFUSED[answers.refused] || SUB_FROM_REFUSED["わからない"];
  lastSub=sub;
  setTimeout(function(){
    hideLoad();
    var d=buildResult(answers);
    if(!d) showNoMatch(sub);
    else render(d,sub);
  },1700);
}

function showNoMatch(sub){
  res.innerHTML='<div class="err">'
    +'<div><strong>判定不能です。</strong>いただいた答えの中に、収録済みの対応表と一致する言葉がありませんでした。'
    +'ここで推測して業界名を出すこともできますが、根拠が無いので出しません。</div>'
    +'<div style="font-size:15px;line-height:1.85">次の一手：'
    +'<br>・「得意なこと」を、<strong>動詞＋目的語</strong>で書き直す（例：割らずにつなぐ／温度を均一に保つ／順番を組み替える）'
    +'<br>・「失敗しやすい条件」を、できるだけ具体的に書く'
    +'</div>'
    +'<div class="again">'
    +'<button class="skip" id="rs">はじめから</button></div></div>';
  res.hidden=false; quick.hidden=false;
  $("rs").addEventListener("click",restart);
  window.scrollTo({top:0,behavior:"smooth"});
}

function restart(){ step=0; answers={}; res.hidden=true; res.innerHTML="";
  load.hidden=true; quick.hidden=false; drawStep(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ================= 結果 ================= */
function render(d,sub){
  var funcs=(d.functions||[]).slice(0,5);
  var cont=d.continuity||{level:"判定不能",subject:"事業",note:"",src:"仮説"};
  var vd=(typeof d.verifiedDemand==="number")?d.verifiedDemand:0;
  var t=decideType(sub,funcs);
  var unk=[];
  if(sub.level==="判定不能") unk.push("代替の探索");
  if(cont.level==="判定不能") unk.push(cont.subject==="組織"?"引き継ぎ困難度":"切迫度");
  if(vd===0) unk.push("言い回しが実在するかの確認");
  var contName=cont.subject==="組織"?"引き継ぎ困難度":"失われる切迫度";

  res.innerHTML=
  '<div class="banner">この結果は<strong>AIを使わず</strong>、収録済みの対応表と、いただいた答えの言葉が一致したものだけを並べています。'
   +(d.matchedWords&&d.matchedWords.length?'一致した言葉：<strong>'+esc(d.matchedWords.join("／"))+'</strong>':"")+'</div>'

  +'<div class="hero">'
    +'<div class="verrow"><span class="verbadge">問診票 <b>v'+version()+'</b> で診断</span>'
    +'<span class="verbadge" style="color:var(--ink-3);border-color:var(--rule-strong);background:var(--surface-3)">外れの記録 <b>'+ledger.length+'</b>件</span></div>'
    +'<div class="was"><div class="cap">世間が付けている名前</div><div class="txt">'+esc(d.label)+'</div></div>'
    +'<div class="heroline">この力を必要としているのは、<br><em>'+funcs.length+'つの、別の業界でした。</em></div>'
  +'</div>'

  +'<div class="sec">'
    +'<div class="secttl"><span class="n">01</span><h2>必要としている業界</h2></div>'
    +'<div class="matches">'
    +funcs.map(function(f,i){
      return '<div class="match" style="animation-delay:'+(i*0.14)+'s" data-i="'+i+'">'
      +'<div class="mtop"><div class="mname">'+esc(f.target)+'</div>'
      +'<div class="badges">'
      +'<span class="bdg '+(DIFF_CLS[f.diff]||"b")+'">'+esc(f.diff)+'</span>'
      +'<span class="bdg '+(SRC_CLS[f.src]||"h")+'">'+esc(f.src||"仮説")+'</span>'
      +'</div></div>'
      +'<div class="saying">'+esc(f.demand)+'</div>'
      +'<div class="from"><b>この力から：</b>'+esc(f.fn)+'<br><b>難しさ：</b>'+esc(f.cond)+'</div>'
      +'<button class="rejbtn" data-rej="'+i+'">ここに当てて、断られた</button>'
      +'<div class="rejpanel" data-panel="'+i+'" hidden></div>'
      +'</div>'; }).join("")
    +'</div>'
    +'<div class="legend">'
    +'<span><span class="bdg a">そのまま</span> 手を加えず届く</span>'
    +'<span><span class="bdg b">設計変更</span> 相手側の変更が要る</span>'
    +'<span><span class="bdg c">認証・規制</span> 時間と資金が要る</span>'
    +'<span><span class="bdg p">一次</span> 本人から得た事実</span>'
    +'<span><span class="bdg h">仮説</span> 未検証</span>'
    +'</div>'
  +'</div>'

  +'<div class="sec">'
    +'<div class="secttl"><span class="n">02</span><h2>同じ力が、業界ごとに別の名前で呼ばれている</h2></div>'
    +'<div class="dict">'
    +funcs.filter(function(f){ return f.aliases && f.aliases.length; }).map(function(f){
      return '<div class="dentry"><div class="dhead">'+esc(f.fn)+'</div><div class="dlist">'
      +f.aliases.slice(0,4).map(function(al){
        return '<div class="drow"><div class="dind">'+esc(al.ind)+'</div><div class="dsay">'+esc(al.say)+'</div></div>'; }).join("")
      +'</div></div>'; }).join("")
    +'</div>'
    +'<p class="summary">呼び方が違うから、探しても見つかりません。<strong>この対応表を持っている者だけが、橋を架けられます。</strong></p>'
  +'</div>'

  +(d.tacit?'<div class="sec">'
    +'<div class="secttl"><span class="n">03</span><h2>言葉になっていない技術</h2></div>'
    +'<p class="summary">'+esc(d.tacit)+'</p>'
    +'<p class="pnote">「新人がつまずくところ」に書かれた内容を、そのまま置いています。<strong>本人に聞かないと出てこない情報です。</strong>公開情報からは取れません。</p>'
  +'</div>':"")

  +'<div class="sec">'
    +'<div class="secttl"><span class="n">04</span><h2>判定</h2></div>'
    +(unk.length?'<div class="unkbar"><strong>判定不能 '+unk.length+'項目</strong> ─ '+esc(unk.join(" ／ "))+'。埋めずに空けています。</div>':"")
    +'<div class="jgrid">'
    +'<div class="jc"><div class="k">型</div><div class="v" style="color:var(--accent)">'+esc(t.name)+'</div><div class="w">'+esc(t.next)+'</div></div>'
    +'<div class="jc '+(sub.level==="判定不能"?"unk":"")+'"><div class="k">代替の探索結果</div><div class="v">'+esc(sub.level)+'</div><div class="w">'+esc(sub.scope)+'</div></div>'
    +'<div class="jc"><div class="k">届いた業界／確認済</div><div class="v">'+funcs.length+'件 ／ '+vd+'件</div><div class="w">'+(vd===0?"言い回しの実在は未確認です。残りは仮説。":"確認済みの件数です。")+'</div></div>'
    +'<div class="jc '+(cont.level==="判定不能"?"unk":"")+'"><div class="k">'+esc(contName)+'</div><div class="v">'+esc(cont.level)+'</div><div class="w">'+esc(cont.note)+'</div></div>'
    +'</div>'
    +'<details class="rb"><summary>型はこの表で機械的に決まります</summary><div class="in"><table>'
    +'<thead><tr><th>代替の探索結果</th><th>条件</th><th>型</th><th>次の一手</th></tr></thead><tbody>'
    +TYPE_RULES.map(function(r){
      return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td><strong>'+esc(r[2])+'</strong></td><td>'+esc(r[3])+'</td></tr>'; }).join("")
    +'</tbody></table></div></details>'
    +'<p class="summary">'+esc(d.note)+'</p>'
  +'</div>'

  +'<div class="sec">'
    +'<div class="secttl"><span class="n">05</span><h2>外れの台帳</h2></div>'
    +'<div class="moat">'
    +'<div class="h">断られるたびに、問診票が1つ賢くなります。</div>'
    +'<p>上の業界カードで<strong>「ここに当てて、断られた」</strong>を押してみてください。断られた理由から、<strong>次に聞くべき質問</strong>が問診票に追加されます。</p>'
    +'<p>候補を出すことは誰にでもできます。<strong>外し方を知っていることは、外した回数でしか手に入りません。</strong>ここが真似できない部分です。</p>'
    +'</div><div id="ledgerbox"></div>'
  +'</div>'

  +'<div class="sec">'
    +'<div class="secttl"><span class="n">06</span><h2>値づけ</h2></div>'
    +'<div class="price">'
    +(d.costs||[]).map(function(c){
      return '<div class="pitem"><span>'+esc(c)+'</span><span>買い手への照会で確定</span></div>'; }).join("")
    +'<div class="pnote"><strong>金額はこの診断では出しません。</strong>根拠のない数字で値をつけたら、私たちの主張そのものが崩れるからです。値は買い手が決めます。この診断が出すのは、<strong>誰に見積を頼めばよいか</strong>と、<strong>その見積書の項目</strong>です。（成約実績 0件）</div>'
    +'</div>'
  +'</div>'

  +'<div class="again"><button class="next" id="rs2">もう一度診断する</button>'
  +'<button class="tiny" id="clr">台帳をリセット（デモ用）</button></div>'

  +'<div class="foot">'
  +'<div>・この画面は<strong>AIを使っていません</strong>。収録済みの対応表による機械的な判定です。</div>'
  +'<div>・<strong>仮説</strong>と付いた項目は未検証です。出所の付かない主張は表示していません。</div>'
  +'<div>・金額・市場規模・年数は、出典が確定するまで記載しません。</div>'
  +'<div>・外れの台帳は、この端末のブラウザにのみ保存されます。</div>'
  +'<div>・本ページはプロトタイプです。実サービスの評価結果ではありません。</div>'
  +'</div>';

  res.hidden=false; quick.hidden=true;
  drawLedger();
  Array.prototype.forEach.call(res.querySelectorAll("[data-rej]"),function(b){
    b.addEventListener("click",function(){ openRej(+b.dataset.rej,funcs); }); });
  $("rs2").addEventListener("click",restart);
  $("clr").addEventListener("click",function(){ ledger=[]; saveLedger(ledger); render(d,sub); });
  window.scrollTo({top:0,behavior:"smooth"});
}

function openRej(i,funcs){
  var p=res.querySelector('[data-panel="'+i+'"]');
  if(!p) return;
  if(!p.hidden){ p.hidden=true; return; }
  p.hidden=false;
  p.innerHTML='<div class="t">断られた理由は、どれに近いですか。</div><div class="rejopts">'
    +REJECTIONS.map(function(r,n){ return '<button class="rejopt" data-r="'+n+'">'+esc(r.why)+'</button>'; }).join("")
    +'</div>';
  Array.prototype.forEach.call(p.querySelectorAll("[data-r]"),function(b){
    b.addEventListener("click",function(){
      var r=REJECTIONS[+b.dataset.r];
      var before=version();
      ledger.push({target:funcs[i].target, why:r.why, add:r.add});
      saveLedger(ledger);
      var after=version();
      p.innerHTML='<div class="evolve"><div class="up">問診票 v'+before+' → v'+after+'</div>'
        +'<div class="add">'+esc(r.add)+'</div></div>';
      Array.prototype.forEach.call(res.querySelectorAll(".verbadge b"),function(el,n){
        el.textContent = (n===0)?("v"+after):String(ledger.length); });
      drawLedger();
    }); });
}

function drawLedger(){
  var box=$("ledgerbox"); if(!box) return;
  if(!ledger.length){
    box.innerHTML='<div class="lempty">まだ1件も記録がありません。<strong>ここが0件のうちは、優位性はありません。</strong>正直にそう表示します。</div>';
    return;
  }
  box.innerHTML='<div class="ledger">'+ledger.map(function(e){
    return '<div class="lrow"><span><strong>'+esc(e.target)+'</strong><br>'
    +'<span style="color:var(--ink-3);font-size:14px">＋ '+esc(e.add)+'</span></span>'
    +'<span class="why">'+esc(e.why)+'</span></div>'; }).join("")+'</div>';
}

drawStep();
</script>
